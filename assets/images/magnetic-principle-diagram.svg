<path d="M260 294h150" stroke="#95A9C9" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M636 294h150" stroke="#95A9C9" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
<g stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round" opacity=".95">
  <path d="M446 224c-20 14-33 33-38 58" stroke-dasharray="3 12"/>
