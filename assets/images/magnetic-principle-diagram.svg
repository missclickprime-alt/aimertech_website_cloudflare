      <rect x="-52" y="-20" width="22" height="10" rx="4"/>
      <rect x="30" y="-20" width="22" height="10" rx="4"/>
      <rect x="-52" y="10" width="22" height="10" rx="4"/>
      <rect x="30" y="10" width="22" height="10" rx="4"/>
