<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">N:1 비접촉 마그네틱 감속기 작동 원리</title>
<desc id="desc">외부 로터와 내부 로터 사이에서 자기장이 비접촉으로 토크를 전달하는 구조를 설명하는 일러스트</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F9FBFF"/>
    <stop offset="1" stop-color="#EDF4FF"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8F9FB7"/>
    <stop offset="0.18" stop-color="#F8FBFF"/>
    <stop offset="0.45" stop-color="#6B7D95"/>
    <stop offset="0.75" stop-color="#D3DDEB"/>
    <stop offset="1" stop-color="#58697E"/>
  </linearGradient>
  <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5B6880"/>
    <stop offset="1" stop-color="#1D2633"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#67C3FF"/>
    <stop offset="1" stop-color="#1F6FEA"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#08224F" flood-opacity="0.16"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#95A9C9"/>
  </marker>
</defs>
<rect width="1100" height="560" rx="28" fill="#fff"/>
<g filter="url(#shadow)">
