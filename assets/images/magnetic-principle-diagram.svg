    <circle r="78" fill="#fff"/>
    <circle r="70" fill="none" stroke="#1C2531" stroke-width="18"/>
    <circle r="89" fill="none" stroke="#9FB6D9" stroke-width="10" stroke-dasharray="11 11"/>
    <ellipse cx="-24" cy="-34" rx="46" ry="18" fill="#fff" opacity=".32"/>
  </g>
  <g transform="translate(550,292)">
