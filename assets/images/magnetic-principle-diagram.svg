  <text x="130" y="502" text-anchor="middle" font-size="28" font-weight="700">구동축 (외부 로터)</text>
  <text x="550" y="180" text-anchor="middle" font-size="29" font-weight="800">자기장</text>
  <text x="550" y="212" text-anchor="middle" font-size="22" fill="#466186" font-weight="600">(비접촉 토크 전달)</text>
  <text x="930" y="502" text-anchor="middle" font-size="28" font-weight="700">피동축 (내부 로터)</text>
